name: Deploy to Production (SSH / Cloudflare Tunnel)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  # ==========================================
  # Build Job - Create Artifacts
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Node.js LTS via nvm
      # ------------------------------------------
      - name: Setup Node.js LTS via nvm
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 24
          NODE_BIN=$(dirname $(nvm which current))
          echo "Node.js bin directory: $NODE_BIN"
          echo "$NODE_BIN" >> $GITHUB_PATH
          node -v
          corepack enable pnpm
          pnpm -v

      # ------------------------------------------
      # Build Vue.js Frontend
      # ------------------------------------------
      - name: Install & Build Frontend
        run: |
          cd frontend
          pnpm install
          pnpm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

      # ------------------------------------------
      # Build .NET Backend
      # ------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Backend
        run: |
          cd backend
          dotnet restore
          dotnet publish Monitoring.Api -c Release -o publish --no-restore

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/publish
          retention-days: 1

      # ------------------------------------------
      # Build Monitoring Agent
      # ------------------------------------------
      - name: Install & Build Agent
        run: |
          cd agent
          pnpm install
          pnpm run build

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-dist
          path: |
            agent/dist
            agent/package.json
            agent/pnpm-lock.yaml
          retention-days: 1

  # ==========================================
  # Deploy Job - Download Artifacts & Deploy
  # ==========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      ENABLE_CLOUDFLARE_TUNNEL: ${{ secrets.ENABLE_CLOUDFLARE_TUNNEL || '' }}
      RAW_CLOUDFLARE_TUNNEL_HOST: ${{ secrets.CLOUDFLARE_TUNNEL_HOST || vars.CLOUDFLARE_TUNNEL_HOST || '' }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_SERVER_PORT }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # ------------------------------------------
      # Download Artifacts
      # ------------------------------------------
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download Backend Publish
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend/publish

      - name: Download Agent Artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-dist
          path: agent

      # ------------------------------------------
      # Resolve SSH transport & prepare client tools
      # ------------------------------------------
      - name: Resolve SSH transport
        id: ssh_target
        shell: bash
        run: |
          set -euo pipefail

          enable_tunnel="$(printf '%s' "${ENABLE_CLOUDFLARE_TUNNEL}" | tr '[:upper:]' '[:lower:]')"
          native_port="${DEPLOY_PORT:-22}"

          use_tunnel="false"
          if [ "$enable_tunnel" = "true" ] || [ "$enable_tunnel" = "1" ] || [ "$enable_tunnel" = "yes" ]; then
            use_tunnel="true"
          fi

          normalize_cloudflare_hostname() {
            local raw_value="$1"
            local normalized

            normalized="$(printf '%s' "$raw_value" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            normalized="${normalized#*://}"
            normalized="${normalized%%/*}"
            normalized="${normalized##*@}"

            if [[ "$normalized" == *:* ]]; then
              normalized="${normalized%%:*}"
            fi

            printf '%s' "$normalized"
          }

          tunnel_host="$(normalize_cloudflare_hostname "${RAW_CLOUDFLARE_TUNNEL_HOST:-}")"

          if [ "$use_tunnel" = "true" ]; then
            if [ -z "$tunnel_host" ]; then
              echo "::error::Cloudflare tunnel mode is enabled but CLOUDFLARE_TUNNEL_HOST is empty. Set it to the published tunnel hostname (for example ssh.example.com), or disable tunnel mode."
              exit 1
            fi

            if [[ "$tunnel_host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::CLOUDFLARE_TUNNEL_HOST must be a published hostname such as ssh.example.com, not a raw server IP (${tunnel_host})."
              exit 1
            fi

            echo "connection_mode=cloudflare" >> "$GITHUB_OUTPUT"
            echo "target_host=$tunnel_host" >> "$GITHUB_OUTPUT"
            echo "target_port=22" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Tunnel enabled. Using SSH hostname: $tunnel_host"
          else
            echo "connection_mode=native" >> "$GITHUB_OUTPUT"
            echo "target_host=${DEPLOY_HOST}" >> "$GITHUB_OUTPUT"
            echo "target_port=${native_port}" >> "$GITHUB_OUTPUT"
            echo "Native SSH enabled. Using ${DEPLOY_HOST}:${native_port}"
          fi

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"

          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
            chmod +x cloudflared
            sudo mv cloudflared /usr/local/bin/cloudflared

            resolved_tunnel_host='${{ steps.ssh_target.outputs.target_host }}'
            if ! getent ahosts "$resolved_tunnel_host" >/dev/null 2>&1; then
              echo "::error::Cloudflare tunnel hostname '$resolved_tunnel_host' does not resolve from the GitHub runner. Make sure CLOUDFLARE_TUNNEL_HOST is the published Cloudflare hostname (for example ssh.example.com), not a URL, username@host, host:port, or server IP."
              exit 1
            fi

            if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "::warning::Cloudflare tunnel mode is enabled without CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET. If Cloudflare Access requires authentication, deployment may fail in GitHub Actions."
            fi
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_github_actions << 'EOF'
          ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

          cat > "$SSH_CONFIG_FILE" << EOF
          Host monitoring-deploy
            HostName ${{ steps.ssh_target.outputs.target_host }}
            User ${DEPLOY_USER}
            Port ${{ steps.ssh_target.outputs.target_port }}
            IdentityFile ~/.ssh/id_github_actions
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 120
          EOF
          chmod 600 "$SSH_CONFIG_FILE"

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              printf '  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %%h --service-token-id %q --service-token-secret %q\n' "${CF_ACCESS_CLIENT_ID}" "${CF_ACCESS_CLIENT_SECRET}" >> "$SSH_CONFIG_FILE"
              echo "Using Cloudflare Access service token for SSH authentication."
            else
              cat >> "$SSH_CONFIG_FILE" << 'EOF'
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
              echo "::warning::Cloudflare tunnel mode is enabled without a service token in the SSH proxy command. cloudflared will attempt interactive browser authentication, which usually fails in CI."
            fi
            cloudflared --version
          fi

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          timeout 60s ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes -o ConnectTimeout=30 monitoring-deploy 'echo "Connected to $(hostname)"'

      # ------------------------------------------
      # Deploy Frontend to Server
      # ------------------------------------------
      - name: Deploy Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend/dist/ monitoring-deploy:/tmp/monitoring-frontend-deploy

      # ------------------------------------------
      # Deploy Backend to Server
      # ------------------------------------------
      - name: Deploy Backend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" backend/publish/ monitoring-deploy:/tmp/monitoring-backend-deploy

      # ------------------------------------------
      # Deploy Agent to Server
      # ------------------------------------------
      - name: Deploy Agent to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" agent/ monitoring-deploy:/tmp/monitoring-agent-deploy

      # ------------------------------------------
      # Finalize Deployment & Restart Services
      # ------------------------------------------
      - name: Finalize Deployment via SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          ssh -F "$SSH_CONFIG_FILE" monitoring-deploy 'bash -se' << 'REMOTE_SCRIPT'
          set -e

          echo "=== Starting Deployment ==="

          # ==========================================
          # 1. Setup .NET Runtime
          # ==========================================
          if ! command -v dotnet &> /dev/null; then
            echo "Installing .NET runtime..."
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
            export PATH="$PATH:/usr/share/dotnet"
            echo 'export PATH="$PATH:/usr/share/dotnet"' >> ~/.bashrc
          fi

          DOTNET_PATH=$(which dotnet || echo "/usr/share/dotnet/dotnet")
          echo "Dotnet path: $DOTNET_PATH"

          # ==========================================
          # 2. Ensure Deployment Directories Exist
          # ==========================================
          echo "Ensuring deployment directories exist..."
          mkdir -p /root/Monitoring/frontend
          mkdir -p /root/Monitoring/backend
          mkdir -p /root/Monitoring/agent

          # ==========================================
          # 3. Create Backend Runtime Environment
          # ==========================================
          echo "Writing backend runtime-env.sh..."
          cat > /root/Monitoring/backend/runtime-env.sh << 'EOF'
          export ASPNETCORE_ENVIRONMENT='Production'
          export ASPNETCORE_URLS='http://localhost:5000'
          export ConnectionStrings__DefaultConnection='${{ secrets.POSTGRESQL_CONNECTION_STRING }}'
          export JwtSettings__SecretKey='${{ secrets.JWT_SECRET_KEY }}'
          export JwtSettings__Issuer='${{ secrets.JWT_ISSUER }}'
          export JwtSettings__Audience='${{ secrets.JWT_AUDIENCE }}'
          export JwtSettings__ExpirationMinutes='${{ secrets.JWT_EXPIRATION_MINUTES }}'
          export JwtSettings__RefreshTokenExpirationDays='${{ secrets.JWT_REFRESH_EXPIRATION_DAYS }}'
          export AgentSettings__Token='${{ secrets.AGENT_TOKEN }}'
          export AllowedOrigins__0='${{ secrets.FRONTEND_URL }}'
          EOF
          chmod 600 /root/Monitoring/backend/runtime-env.sh

          # ==========================================
          # 4. Create Agent Environment
          # ==========================================
          echo "Writing agent .env..."
          cat > /root/Monitoring/agent/.env << 'EOF'
          API_URL=http://localhost:5000
          SERVER_TOKEN=${{ secrets.AGENT_TOKEN }}
          SERVER_ID=${{ secrets.AGENT_SERVER_ID }}
          METRICS_INTERVAL=30000
          HEARTBEAT_INTERVAL=60000
          EOF
          chmod 600 /root/Monitoring/agent/.env

          # ==========================================
          # 5. Stop PM2 Processes
          # ==========================================
          echo "Stopping PM2 processes..."
          pm2 stop monitoring-frontend 2>/dev/null || true
          pm2 stop monitoring-api 2>/dev/null || true
          pm2 stop monitoring-agent 2>/dev/null || true

          # ==========================================
          # 6. Deploy Frontend (Static Files)
          # ==========================================
          echo "Deploying Frontend..."
          cd /root/Monitoring/frontend
          # Backup current dist
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          # Move new files
          mv /tmp/monitoring-frontend-deploy dist
          rm -rf /tmp/monitoring-frontend-deploy

          # ==========================================
          # 7. Deploy Backend
          # ==========================================
          echo "Deploying Backend..."
          cd /root/Monitoring/backend
          # Backup current publish
          if [ -f "Monitoring.Api.dll" ]; then
            mkdir -p publish.backup
            cp *.dll *.json *.deps.json publish.backup/ 2>/dev/null || true
          fi
          # Move new files
          rm -rf *.dll *.json *.deps.json 2>/dev/null || true
          cp -r /tmp/monitoring-backend-deploy/* .
          rm -rf /tmp/monitoring-backend-deploy

          # Create startup script
          cat > /root/Monitoring/backend/start.sh << EOF
          #!/bin/bash
          set -a
          . /root/Monitoring/backend/runtime-env.sh
          set +a
          cd /root/Monitoring/backend
          ASPNETCORE_ENVIRONMENT=Production $DOTNET_PATH Monitoring.Api.dll
          EOF
          chmod +x /root/Monitoring/backend/start.sh

          # ==========================================
          # 8. Deploy Agent
          # ==========================================
          echo "Deploying Agent..."
          cd /root/Monitoring/agent
          # Backup current dist
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          # Move new files
          mv /tmp/monitoring-agent-deploy/dist .
          mv /tmp/monitoring-agent-deploy/package.json .
          if [ -f /tmp/monitoring-agent-deploy/pnpm-lock.yaml ]; then
            mv /tmp/monitoring-agent-deploy/pnpm-lock.yaml .
          fi
          rm -rf /tmp/monitoring-agent-deploy

          # Install agent dependencies
          echo "Installing agent dependencies..."
          pnpm install --prod

          # ==========================================
          # 9. Restart PM2 Processes
          # ==========================================
          echo "Restarting PM2 processes..."
          pm2 delete monitoring-frontend 2>/dev/null || true
          pm2 delete monitoring-api 2>/dev/null || true
          pm2 delete monitoring-agent 2>/dev/null || true

          # Serve frontend static via Node.js http-server
          if ! command -v http-server &> /dev/null; then
            pnpm install -g http-server
          fi
          pm2 start http-server --name "monitoring-frontend" -- /root/Monitoring/frontend/dist -p 3000 -c-1 --spa

          # Start Backend
          pm2 start /root/Monitoring/backend/start.sh --name "monitoring-api"

          # Start Agent
          pm2 start /root/Monitoring/agent/dist/index.js --name "monitoring-agent" --cwd /root/Monitoring/agent

          # Save PM2 state
          pm2 save

          # ==========================================
          # 10. Cleanup Old Backups
          # ==========================================
          echo "Cleaning up old backups..."
          cd /root/Monitoring/frontend
          ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          cd /root/Monitoring/backend
          rm -rf publish.backup 2>/dev/null || true

          cd /root/Monitoring/agent
          ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          echo "=== Deployment Completed Successfully ==="

          # Show PM2 status
          pm2 status
          REMOTE_SCRIPT
