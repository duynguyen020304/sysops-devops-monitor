name: Deploy to Dev (SSH / Cloudflare Tunnel)

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  # ==========================================
  # Build Job - Create Artifacts
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Node.js LTS via nvm
      # ------------------------------------------
      - name: Setup Node.js LTS via nvm
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 24
          NODE_BIN=$(dirname $(nvm which current))
          echo "Node.js bin directory: $NODE_BIN"
          echo "$NODE_BIN" >> $GITHUB_PATH
          node -v
          corepack enable pnpm
          pnpm -v

      # ------------------------------------------
      # Build Astro Frontend
      # ------------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install & Build Frontend
        run: |
          cd frontend
          bun install
          PUBLIC_BACKEND_DOMAIN=${{ secrets.PUBLIC_BACKEND_DOMAIN }} \
          PUBLIC_IMAGE_BASE_URL=${{ secrets.PUBLIC_IMAGE_BASE_URL }} \
          FRONTEND_DOMAIN=${{ secrets.FRONTEND_DOMAIN }} \
          PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }} \
          bun run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-full
          path: |
            frontend/dist
            frontend/package.json
            frontend/bun.lock
          retention-days: 1

      # ------------------------------------------
      # Build SvelteKit Admin Panel
      # ------------------------------------------
      - name: Install & Build Frontend-Admin
        run: |
          cd frontend-admin
          bun install
          PUBLIC_BACKEND_DOMAIN=${{ secrets.PUBLIC_BACKEND_DOMAIN }} \
          PUBLIC_IMAGE_BASE_URL=${{ secrets.PUBLIC_IMAGE_BASE_URL }} \
          FRONTEND_DOMAIN=${{ secrets.FRONTEND_DOMAIN }} \
          bun run build

      - name: Upload Frontend-Admin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-admin-full
          path: |
            frontend-admin/build
            frontend-admin/package.json
          retention-days: 1

      # ------------------------------------------
      # Build .NET Backend
      # ------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Backend
        run: |
          cd backend
          dotnet restore
          dotnet publish NexPress.Api -c Release -o publish --no-restore

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/publish
          retention-days: 1

      # ------------------------------------------
      # Build Python RAG Server
      # ------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload RAG Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-server
          path: |
            nexpress_rag_server/app
            nexpress_rag_server/alembic
            nexpress_rag_server/alembic.ini
            nexpress_rag_server/main.py
            nexpress_rag_server/requirements.txt
          retention-days: 1

  # ==========================================
  # Deploy Job - Download Artifacts & Deploy
  # ==========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      ENABLE_CLOUDFLARE_TUNNEL: ${{ secrets.ENABLE_CLOUDFLARE_TUNNEL || '' }}
      RAW_CLOUDFLARE_TUNNEL_HOST: ${{ secrets.CLOUDFLARE_TUNNEL_HOST || vars.CLOUDFLARE_TUNNEL_HOST || 'https://ssh-hk1.vyta.io.vn/' }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_SERVER_PORT }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # ------------------------------------------
      # Download Artifacts
      # ------------------------------------------
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-full
          path: frontend

      - name: Download Frontend-Admin Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin-full
          path: frontend-admin

      - name: Download Backend Publish
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend/publish

      - name: Download RAG Server Artifact
        uses: actions/download-artifact@v4
        with:
          name: rag-server
          path: nexpress_rag_server

      # ------------------------------------------
      # Resolve SSH transport & prepare client tools
      # ------------------------------------------
      - name: Resolve SSH transport
        id: ssh_target
        shell: bash
        run: |
          set -euo pipefail

          enable_tunnel="$(printf '%s' "${ENABLE_CLOUDFLARE_TUNNEL}" | tr '[:upper:]' '[:lower:]')"
          native_port="${DEPLOY_PORT:-22}"

          use_tunnel="false"
          if [ "$enable_tunnel" = "true" ] || [ "$enable_tunnel" = "1" ] || [ "$enable_tunnel" = "yes" ]; then
            use_tunnel="true"
          fi

          normalize_cloudflare_hostname() {
            local raw_value="$1"
            local normalized

            normalized="$(printf '%s' "$raw_value" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            normalized="${normalized#*://}"
            normalized="${normalized%%/*}"
            normalized="${normalized##*@}"

            if [[ "$normalized" == *:* ]]; then
              normalized="${normalized%%:*}"
            fi

            printf '%s' "$normalized"
          }

          tunnel_host="$(normalize_cloudflare_hostname "${RAW_CLOUDFLARE_TUNNEL_HOST:-}")"

          if [ "$use_tunnel" = "true" ]; then
            if [ -z "$tunnel_host" ]; then
              echo "::error::Cloudflare tunnel mode is enabled but CLOUDFLARE_TUNNEL_HOST is empty. Set it to the published tunnel hostname (for example ssh.example.com), or disable tunnel mode."
              exit 1
            fi

            if [[ "$tunnel_host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::CLOUDFLARE_TUNNEL_HOST must be a published hostname such as ssh.example.com, not a raw server IP (${tunnel_host})."
              exit 1
            fi

            echo "connection_mode=cloudflare" >> "$GITHUB_OUTPUT"
            echo "target_host=$tunnel_host" >> "$GITHUB_OUTPUT"
            echo "target_port=22" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Tunnel enabled. Using SSH hostname: $tunnel_host"
          else
            echo "connection_mode=native" >> "$GITHUB_OUTPUT"
            echo "target_host=${DEPLOY_HOST}" >> "$GITHUB_OUTPUT"
            echo "target_port=${native_port}" >> "$GITHUB_OUTPUT"
            echo "Native SSH enabled. Using ${DEPLOY_HOST}:${native_port}"
          fi

      - name: Prepare SSH client
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"

          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
            chmod +x cloudflared
            sudo mv cloudflared /usr/local/bin/cloudflared

            resolved_tunnel_host='${{ steps.ssh_target.outputs.target_host }}'
            if ! getent ahosts "$resolved_tunnel_host" >/dev/null 2>&1; then
              echo "::error::Cloudflare tunnel hostname '$resolved_tunnel_host' does not resolve from the GitHub runner. Make sure CLOUDFLARE_TUNNEL_HOST is the published Cloudflare hostname (for example ssh.example.com), not a URL, username@host, host:port, or server IP."
              exit 1
            fi

            if [ -z "${CF_ACCESS_CLIENT_ID:-}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "::warning::Cloudflare tunnel mode is enabled without CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET. If Cloudflare Access requires authentication, deployment may fail in GitHub Actions."
            fi
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/id_github_actions << 'EOF'
          ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_github_actions

          cat > "$SSH_CONFIG_FILE" << EOF
          Host nexpress-deploy
            HostName ${{ steps.ssh_target.outputs.target_host }}
            User ${DEPLOY_USER}
            Port ${{ steps.ssh_target.outputs.target_port }}
            IdentityFile ~/.ssh/id_github_actions
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 120
          EOF
          chmod 600 "$SSH_CONFIG_FILE"

          if [ "${{ steps.ssh_target.outputs.connection_mode }}" = "cloudflare" ]; then
            if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
              printf '  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %%h --service-token-id %q --service-token-secret %q\n' "${CF_ACCESS_CLIENT_ID}" "${CF_ACCESS_CLIENT_SECRET}" >> "$SSH_CONFIG_FILE"
              echo "Using Cloudflare Access service token for SSH authentication."
            else
              cat >> "$SSH_CONFIG_FILE" << 'EOF'
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF
              echo "::warning::Cloudflare tunnel mode is enabled without a service token in the SSH proxy command. cloudflared will attempt interactive browser authentication, which usually fails in CI."
            fi
            cloudflared --version
          fi

      - name: Verify SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          timeout 60s ssh -F "$SSH_CONFIG_FILE" -o BatchMode=yes -o ConnectTimeout=30 nexpress-deploy 'echo "Connected to $(hostname)"'

      # ------------------------------------------
      # Deploy Frontend to Server
      # ------------------------------------------
      - name: Deploy Frontend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend/ nexpress-deploy:/tmp/nexpress-frontend-deploy

      # ------------------------------------------
      # Deploy Frontend-Admin to Server
      # ------------------------------------------
      - name: Deploy Frontend-Admin to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" frontend-admin/ nexpress-deploy:/tmp/nexpress-admin-deploy

      # ------------------------------------------
      # Deploy Backend to Server
      # ------------------------------------------
      - name: Deploy Backend to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" backend/publish/ nexpress-deploy:/tmp/nexpress-backend-deploy

      # ------------------------------------------
      # Deploy RAG Server to Server
      # ------------------------------------------
      - name: Deploy RAG Server to Server
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          rsync -avzr --delete -e "ssh -F $SSH_CONFIG_FILE" nexpress_rag_server/ nexpress-deploy:/tmp/nexpress-rag-deploy

      # ------------------------------------------
      # Finalize Deployment & Restart Services
      # ------------------------------------------
      - name: Finalize Deployment via SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH_CONFIG_FILE="$HOME/.ssh/config"
          ssh -F "$SSH_CONFIG_FILE" nexpress-deploy 'bash -se' << 'REMOTE_SCRIPT'
          set -e

          echo "=== Starting Deployment ==="

          # ==========================================
          # 1. Setup .NET Runtime
          # ==========================================
          if ! command -v dotnet &> /dev/null; then
            echo "Installing .NET runtime..."
            wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet
            export PATH="$PATH:/usr/share/dotnet"
            echo 'export PATH="$PATH:/usr/share/dotnet"' >> ~/.bashrc
          fi

          DOTNET_PATH=$(which dotnet || echo "/usr/share/dotnet/dotnet")
          echo "Dotnet path: $DOTNET_PATH"

          # ==========================================
          # 1b. Setup Python Runtime
          # ==========================================
          if ! command -v python3 &> /dev/null; then
            echo "Installing Python 3.12..."
            apt-get update -qq
            apt-get install -y python3.12 python3.12-venv python3-pip
            update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.12 1
          fi

          PYTHON_PATH=$(which python3 || echo "/usr/bin/python3")
          echo "Python path: $PYTHON_PATH"
          $PYTHON_PATH --version

          # ==========================================
          # 2. Ensure Deployment Directories Exist
          # ==========================================
          echo "Ensuring deployment directories exist..."
          mkdir -p /root/NexPress/frontend
          mkdir -p /root/NexPress/frontend-admin
          mkdir -p /root/NexPress/backend
          mkdir -p /root/NexPress/nexpress_rag_server

          # ==========================================
          # 3. Create Backend Runtime Environment
          # ==========================================
          echo "Writing backend runtime-env.sh..."
          cat > /root/NexPress/backend/runtime-env.sh << 'EOF'
          export ASPNETCORE_ENVIRONMENT='Production'
          export ConnectionStrings__DefaultConnection='${{ secrets.POSTGRESQL_CONNECTION_STRING }}'
          export ConnectionStrings__Redis='${{ secrets.REDIS_CONNECTION_STRING }}'
          export JwtSettings__SecretKey='${{ secrets.JWT_SECRET_KEY }}'
          export EmailSettings__SmtpUsername='${{ secrets.EMAIL_SMTP_USERNAME }}'
          export EmailSettings__SmtpPassword='${{ secrets.EMAIL_SMTP_PASSWORD }}'
          export EmailSettings__FromEmail='${{ secrets.EMAIL_FROM_EMAIL }}'
          export EmailSettings__ApiBaseUrl='${{ secrets.PUBLIC_BACKEND_DOMAIN }}'
          export EmailSettings__FrontendBaseUrl='${{ secrets.FRONTEND_URL }}'
          export GoogleOAuth__ClientId='${{ secrets.PUBLIC_GOOGLE_CLIENT_ID }}'
          export GoogleOAuth__ClientSecret='${{ secrets.GOOGLE_CLIENT_SECRET }}'
          export AllowedOrigins__0='${{ secrets.FRONTEND_URL }}'
          export AllowedOrigins__1='${{ secrets.FRONTEND_ADMIN_URL }}'
          export N8nWebhook__HeaderName='${{ secrets.N8N_WEBHOOK_HEADER_NAME }}'
          export N8nWebhook__SharedSecret='${{ secrets.N8N_WEBHOOK_SHARED_SECRET }}'
          export AUTOMAPPER_LICENSE_KEY='${{ secrets.AUTOMAPPER_LICENSE_KEY }}'
          export S3Storage__BucketName='${{ secrets.S3_BUCKET_NAME }}'
          export S3Storage__Region='${{ secrets.S3_REGION }}'
          export S3Storage__AccessKey='${{ secrets.S3_ACCESS_KEY }}'
          export S3Storage__SecretKey='${{ secrets.S3_SECRET_KEY }}'
          export S3Storage__SessionToken='${{ secrets.S3_SESSION_TOKEN }}'
          export S3Storage__ServiceUrl='${{ secrets.S3_SERVICE_URL }}'
          export S3Storage__UsePathStyle='${{ secrets.S3_USE_PATH_STYLE }}'
          export S3Storage__DefaultPresignedUrlExpirationInSeconds='${{ secrets.S3_Default_PresignedUrl_Expiration_InSeconds }}'
          export S3Storage__MaxPresignedUrlExpirationInSeconds='${{ secrets.S3_Max_PresignedUrl_Expiration_InSeconds }}'
          EOF
          chmod 600 /root/NexPress/backend/runtime-env.sh

          # ==========================================
          # 3b. Create RAG Server Environment File
          # ==========================================
          echo "Writing RAG server environment file..."
          cat > /root/NexPress/nexpress_rag_server/.env << 'EOF'
          DATABASE_URL=${{ secrets.POSTGRESQL_CONNECTION_STRING }}
          HOST=127.0.0.1
          PORT=9001
          KAGGLE_OUTPUT_DIR=/root/NexPress/nexpress_rag_server/outputs
          CORS_ORIGINS=["${{ secrets.FRONTEND_URL }}", "${{ secrets.FRONTEND_ADMIN_URL }}"]
          EOF
          chmod 600 /root/NexPress/nexpress_rag_server/.env

          # ==========================================
          # 4. Stop PM2 Processes
          # ==========================================
          echo "Stopping PM2 processes..."
          /root/.bun/bin/pm2 stop nexpress-frontend 2>/dev/null || true
          /root/.bun/bin/pm2 stop nexpress-admin 2>/dev/null || true
          /root/.bun/bin/pm2 stop nexpress-api 2>/dev/null || true
          /root/.bun/bin/pm2 stop nexpress-rag 2>/dev/null || true

          # ==========================================
          # 5. Deploy Frontend
          # ==========================================
          echo "Deploying Frontend..."
          cd /root/NexPress/frontend
          # Backup current dist
          if [ -d "dist" ]; then
            mv dist dist.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          # Move new files
          mv /tmp/nexpress-frontend-deploy/dist .
          mv /tmp/nexpress-frontend-deploy/package.json .
          mv /tmp/nexpress-frontend-deploy/bun.lock .
          rm -rf /tmp/nexpress-frontend-deploy

          # Install dependencies (Astro SSR needs node_modules at runtime)
          echo "Installing frontend dependencies..."
          /root/.bun/bin/bun install

          # ==========================================
          # 6. Deploy Frontend-Admin
          # ==========================================
          echo "Deploying Frontend-Admin..."
          cd /root/NexPress/frontend-admin
          # Backup current build
          if [ -d "build" ]; then
            mv build build.backup.$(date +%Y%m%d_%H%M%S) || true
          fi
          # Move new files
          mv /tmp/nexpress-admin-deploy/build .
          mv /tmp/nexpress-admin-deploy/package.json .
          rm -rf /tmp/nexpress-admin-deploy

          # Install dependencies
          echo "Installing admin dependencies..."
          /root/.bun/bin/bun install

          # ==========================================
          # 7. Deploy Backend
          # ==========================================
          echo "Deploying Backend..."
          cd /root/NexPress/backend
          # Backup current publish
          if [ -f "NexPress.Api.dll" ]; then
            mkdir -p publish.backup
            cp *.dll *.json *.deps.json publish.backup/ 2>/dev/null || true
          fi
          # Move new files
          rm -rf *.dll *.json *.deps.json 2>/dev/null || true
          cp -r /tmp/nexpress-backend-deploy/* .
          rm -rf /tmp/nexpress-backend-deploy

          # Copy appsettings if not exists
          if [ -f appsettings.Production.json ]; then
            cp appsettings.Production.json appsettings.Production.json.bak
          fi

          # Create startup script using dynamic dotnet path
          cat > /root/NexPress/backend/start.sh << EOF
          #!/bin/bash
          set -a
          . /root/NexPress/backend/runtime-env.sh
          set +a
          cd /root/NexPress/backend
          ASPNETCORE_ENVIRONMENT=Production $DOTNET_PATH NexPress.Api.dll
          EOF
          chmod +x /root/NexPress/backend/start.sh

          # ==========================================
          # 7b. Deploy RAG Server
          # ==========================================
          echo "Deploying RAG Server..."
          cd /root/NexPress/nexpress_rag_server

          # Backup current deployment
          if [ -d "app" ]; then
            mkdir -p backup
            cp -r app alembic alembic.ini main.py requirements.txt backup/ 2>/dev/null || true
          fi

          # Move new files
          rm -rf app alembic alembic.ini main.py requirements.txt 2>/dev/null || true
          cp -r /tmp/nexpress-rag-deploy/* .
          rm -rf /tmp/nexpress-rag-deploy

          # Create Python virtual environment and install dependencies
          echo "Creating Python virtual environment..."
          $PYTHON_PATH -m venv nexpress-rag
          source nexpress-rag/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          deactivate

          # Run Alembic migrations
          echo "Running Alembic migrations..."
          source nexpress-rag/bin/activate
          export DATABASE_URL='${{ secrets.POSTGRESQL_CONNECTION_STRING }}'
          alembic upgrade head
          deactivate

          # Create outputs directory
          mkdir -p outputs

          # Create startup script for RAG server
          cat > /root/NexPress/nexpress_rag_server/start.sh << 'EOF'
          #!/bin/bash
          cd /root/NexPress/nexpress_rag_server
          source nexpress-rag/bin/activate
          exec uvicorn main:app --host 127.0.0.1 --port 9001 --workers 2
          EOF
          chmod +x /root/NexPress/nexpress_rag_server/start.sh

          # ==========================================
          # 8. Restart PM2 Processes
          # ==========================================
          echo "Restarting PM2 processes..."
          /root/.bun/bin/pm2 delete nexpress-frontend 2>/dev/null || true
          /root/.bun/bin/pm2 delete nexpress-admin 2>/dev/null || true
          /root/.bun/bin/pm2 delete nexpress-api 2>/dev/null || true
          /root/.bun/bin/pm2 delete nexpress-rag 2>/dev/null || true

          # Start Frontend
          /root/.bun/bin/pm2 start node --name "nexpress-frontend" -- /root/NexPress/frontend/dist/server/entry.mjs

          # Start Admin
          HOST=${{ secrets.HOST_FRONTEND_ADMIN }} PORT=${{ secrets.FRONTEND_ADMIN_PORT }} /root/.bun/bin/pm2 start node --name "nexpress-admin" -- /root/NexPress/frontend-admin/build/index.js

          # Start Backend
          /root/.bun/bin/pm2 start /root/NexPress/backend/start.sh --name "nexpress-api"

          # Start RAG Server
          /root/.bun/bin/pm2 start /root/NexPress/nexpress_rag_server/start.sh --name "nexpress-rag"

          # Save PM2 state
          /root/.bun/bin/pm2 save

          # ==========================================
          # 9. Cleanup
          # ==========================================
          echo "Cleaning up old backups..."
          cd /root/NexPress/frontend
          ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          cd /root/NexPress/frontend-admin
          ls -dt build.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

          cd /root/NexPress/backend
          rm -rf publish.backup 2>/dev/null || true

          cd /root/NexPress/nexpress_rag_server
          rm -rf backup 2>/dev/null || true

          echo "=== Deployment Completed Successfully ==="

          # Show PM2 status
          /root/.bun/bin/pm2 status
          REMOTE_SCRIPT
